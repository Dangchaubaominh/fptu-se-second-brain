name: Release Windows

# Push a tag like v1.1.0 to build, test and publish a GitHub Release with the
# Windows zip. The tag must match `version:` in pubspec.yaml.
# "Run workflow" (manual) builds the zip as a downloadable artifact only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Optional: your own signing certificate (tool/create_msix_certificate.ps1).
      # Without it the MSIX step is skipped and only the zip is published.
      MSIX_CERT_BASE64: ${{ secrets.MSIX_CERT_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Check tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match pubspec.yaml version $v. Update pubspec.yaml first."
          }

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release

      - name: Zip build
        shell: pwsh
        run: |
          $name = "fptu-brain-windows-${{ github.ref_name }}.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $name
          "ZIP_NAME=$name" >> $env:GITHUB_ENV

      - name: Build signed MSIX installer
        if: env.MSIX_CERT_BASE64 != ''
        shell: pwsh
        env:
          MSIX_CERT_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MSIX_CERT_BASE64))
          try {
            dart run msix:create --build-windows false --certificate-path $pfx `
              --certificate-password $env:MSIX_CERT_PASSWORD `
              --output-path build/msix --output-name "fptu-brain-${{ github.ref_name }}"
            # Public part of the certificate, which users trust once to install the MSIX.
            $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:MSIX_CERT_PASSWORD)
            [IO.File]::WriteAllBytes('build/msix/fptu-brain.cer', $cert.Export('Cert'))
          } finally {
            Remove-Item $pfx -Force
          }

      - uses: actions/upload-artifact@v4
        with:
          name: fptu-brain-windows
          path: |
            ${{ env.ZIP_NAME }}
            build/msix/*
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_NAME }}
            build/msix/*
          generate_release_notes: true
