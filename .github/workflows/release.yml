name: Release Windows

# Push a tag like v1.1.0 to build, test and publish a GitHub Release with the
# Windows zip. The tag must match `version:` in pubspec.yaml.
# "Run workflow" (manual) builds the zip as a downloadable artifact only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Check tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match pubspec.yaml version $v. Update pubspec.yaml first."
          }

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release

      - name: Zip build
        shell: pwsh
        run: |
          $name = "fptu-brain-windows-${{ github.ref_name }}.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $name
          "ZIP_NAME=$name" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: fptu-brain-windows
          path: ${{ env.ZIP_NAME }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
